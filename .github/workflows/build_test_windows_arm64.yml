# Workflow for building and testing on Windows ARM64

name: Build/Test Windows ARM64
on:
  merge_group:
  push:
    branches:
      - main
      - v*.*.x
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_test_windows_arm64:
    name: Windows ARM64 / ${{ matrix.config }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'CI:none') }}
    runs-on: windows-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Release
            build_type: Release
            enable_tests: ON
          - config: Debug
            build_type: Debug
            enable_tests: OFF

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      - name: Setup MSVC for ARM64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64_arm64

      - name: Setup CMake
        uses: lukka/get-cmake@070a0507a7abe157ef918deec391da1be197d2d1 # v3.30.5

      - name: Cache CMake build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build-arm64
            !build-arm64/Testing
          key: ${{ runner.os }}-arm64-cmake-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cmake-${{ matrix.config }}-
            ${{ runner.os }}-arm64-cmake-

      - name: CMake Configure
        run: |
          cmake -G "Visual Studio 17 2022" -A ARM64 `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DBUILD_TESTING=${{ matrix.enable_tests }} `
            -DJPEGXL_ENABLE_FUZZERS=OFF `
            -DJPEGXL_ENABLE_DEVTOOLS=OFF `
            -DJPEGXL_ENABLE_TOOLS=ON `
            -DJPEGXL_ENABLE_DOXYGEN=OFF `
            -DJPEGXL_ENABLE_MANPAGES=OFF `
            -DJPEGXL_ENABLE_BENCHMARK=OFF `
            -DJPEGXL_ENABLE_EXAMPLES=OFF `
            -DJPEGXL_ENABLE_TCMALLOC=OFF `
            -DJPEGXL_ENABLE_PLUGINS=OFF `
            -DJPEGXL_ENABLE_VIEWERS=OFF `
            -DJPEGXL_ENABLE_OPENEXR=OFF `
            -DJPEGXL_ENABLE_SJPEG=ON `
            -DJPEGXL_FORCE_SYSTEM_BROTLI=OFF `
            -DJPEGXL_FORCE_SYSTEM_HWY=OFF `
            -B build-arm64 `
            -S .
        shell: pwsh

      - name: CMake Build
        run: |
          cmake --build build-arm64 --config ${{ matrix.build_type }} --parallel 2
        shell: pwsh

      - name: Verify ARM64 Binaries
        run: |
          Write-Host "Verifying ARM64 architecture of built binaries..."
          $dumpbinPath = (Get-Command dumpbin.exe).Source
          Write-Host "Using dumpbin from: $dumpbinPath"
          
          # Check main executables
          $exeFiles = @(
            "build-arm64\tools\${{ matrix.build_type }}\cjxl.exe",
            "build-arm64\tools\${{ matrix.build_type }}\djxl.exe",
            "build-arm64\tools\${{ matrix.build_type }}\jxlinfo.exe"
          )
          
          foreach ($exe in $exeFiles) {
            if (Test-Path $exe) {
              Write-Host "`nChecking: $exe"
              $output = & dumpbin /headers $exe | Select-String "machine"
              Write-Host $output
              if ($output -notmatch "AA64") {
                Write-Error "Binary $exe is not ARM64!"
                exit 1
              }
            } else {
              Write-Warning "File not found: $exe"
            }
          }
          
          # Check main libraries
          $dllFiles = @(
            "build-arm64\lib\${{ matrix.build_type }}\jxl.dll",
            "build-arm64\lib\${{ matrix.build_type }}\jxl_dec.dll"
          )
          
          foreach ($dll in $dllFiles) {
            if (Test-Path $dll) {
              Write-Host "`nChecking: $dll"
              $output = & dumpbin /headers $dll | Select-String "machine"
              Write-Host $output
              if ($output -notmatch "AA64") {
                Write-Error "Library $dll is not ARM64!"
                exit 1
              }
            } else {
              Write-Warning "File not found: $dll"
            }
          }
          
          Write-Host "`nAll binaries verified as ARM64!"
        shell: pwsh

      - name: List Build Artifacts
        run: |
          Write-Host "Build artifacts in tools/${{ matrix.build_type }}:"
          Get-ChildItem -Path "build-arm64\tools\${{ matrix.build_type }}" -File | Format-Table Name, Length
          
          Write-Host "`nBuild artifacts in lib/${{ matrix.build_type }}:"
          Get-ChildItem -Path "build-arm64\lib\${{ matrix.build_type }}" -File | Format-Table Name, Length
        shell: pwsh

      - name: Run Tests
        if: |
          matrix.enable_tests == 'ON' && 
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            contains(github.event.pull_request.labels.*.name, 'CI:full')))
        run: |
          Write-Host "Note: Tests are built for ARM64 but cannot run on x64 runners."
          Write-Host "Tests would need to be run on actual ARM64 hardware or emulator."
          Write-Host "Skipping test execution on x64 runner."
        shell: pwsh

      - name: Package Artifacts
        if: matrix.config == 'Release'
        run: |
          $artifactDir = "libjxl-windows-arm64-${{ matrix.build_type }}"
          New-Item -ItemType Directory -Force -Path $artifactDir
          
          # Copy executables
          Copy-Item "build-arm64\tools\${{ matrix.build_type }}\*.exe" -Destination $artifactDir -ErrorAction SilentlyContinue
          
          # Copy libraries
          Copy-Item "build-arm64\lib\${{ matrix.build_type }}\*.dll" -Destination $artifactDir -ErrorAction SilentlyContinue
          Copy-Item "build-arm64\lib\${{ matrix.build_type }}\*.lib" -Destination $artifactDir -ErrorAction SilentlyContinue
          
          # Copy third-party dependencies
          Copy-Item "build-arm64\third_party\brotli\${{ matrix.build_type }}\*.dll" -Destination $artifactDir -ErrorAction SilentlyContinue
          
          # Create README
          $readmeContent = "# libjxl Windows ARM64 Build`n`n"
          $readmeContent += "## Build Information`n"
          $readmeContent += "- Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')`n"
          $readmeContent += "- Configuration: ${{ matrix.build_type }}`n"
          $readmeContent += "- Architecture: ARM64 (aarch64)`n"
          $readmeContent += "- Compiler: MSVC (Visual Studio 2022)`n`n"
          $readmeContent += "## Contents`n"
          $readmeContent += "This package contains the JPEG XL encoder/decoder tools and libraries built for Windows ARM64.`n`n"
          $readmeContent += "### Command-Line Tools`n"
          $readmeContent += "- cjxl.exe - JPEG XL encoder`n"
          $readmeContent += "- djxl.exe - JPEG XL decoder`n"
          $readmeContent += "- jxlinfo.exe - JPEG XL file information tool`n`n"
          $readmeContent += "### Libraries`n"
          $readmeContent += "- jxl.dll - Main JPEG XL library (encoder + decoder)`n"
          $readmeContent += "- jxl_dec.dll - JPEG XL decoder library`n"
          $readmeContent += "- jxl_cms.dll - Color management system library`n"
          $readmeContent += "- jxl_threads.dll - Threading support library`n`n"
          $readmeContent += "### Third-Party Dependencies`n"
          $readmeContent += "- brotlicommon.dll`n"
          $readmeContent += "- brotlidec.dll`n"
          $readmeContent += "- brotlienc.dll`n`n"
          $readmeContent += "## Usage`n"
          $readmeContent += "All DLL files must be in the same directory as the executables or in your PATH.`n`n"
          $readmeContent += "### Encoding:`n"
          $readmeContent += "``````n"
          $readmeContent += "cjxl.exe input.png output.jxl`n"
          $readmeContent += "``````n`n"
          $readmeContent += "### Decoding:`n"
          $readmeContent += "``````n"
          $readmeContent += "djxl.exe input.jxl output.png`n"
          $readmeContent += "``````n`n"
          $readmeContent += "### File Information:`n"
          $readmeContent += "``````n"
          $readmeContent += "jxlinfo.exe image.jxl`n"
          $readmeContent += "``````n`n"
          $readmeContent += "## Requirements`n"
          $readmeContent += "- Windows 11 ARM64 or Windows 10 ARM64`n"
          $readmeContent += "- ARM64 processor (Qualcomm Snapdragon, Microsoft SQ series, etc.)`n`n"
          $readmeContent += "## Source`n"
          $readmeContent += "- GitHub: https://github.com/libjxl/libjxl`n"
          $readmeContent | Out-File -FilePath "$artifactDir\README.md" -Encoding UTF8
          
          Write-Host "Packaged artifacts:"
          Get-ChildItem -Path $artifactDir -Recurse | Format-Table Name, Length
        shell: pwsh

      - name: Upload Build Artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: libjxl-windows-arm64-${{ matrix.build_type }}
          path: libjxl-windows-arm64-${{ matrix.build_type }}
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          Write-Host "=== Build Summary ==="
          Write-Host "Configuration: ${{ matrix.config }}"
          Write-Host "Build Type: ${{ matrix.build_type }}"
          Write-Host "Architecture: ARM64"
          Write-Host "Status: ${{ job.status }}"
        shell: pwsh